[project]
name = "k12-pipeline"
version = "0.1.0"
description = "Imports STAAR released tests, generates variants, and runs the AI reviewer."
requires-python = ">=3.11"
# Only what the importer needs. Keep ranges bounded so pip never backtracks through old releases.
dependencies = [
  "pymupdf>=1.26,<2",
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]
# For the AI reviewer: pip install -e ".[ai]"
ai = ["anthropic>=2.14,<3", "pydantic>=2.7,<3"]

[project.scripts]
k12-pipeline = "k12_pipeline.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/k12_pipeline"]

[tool.ruff]
line-length = 110
target-version = "py311"
