[project]
name = "k12-pipeline"
version = "0.1.0"
description = "Imports STAAR released tests, generates variants, and runs the AI reviewer."
requires-python = ">=3.11"
# Keep ranges bounded so pip never backtracks through old releases.
# anthropic and pydantic are for the AI reviewer; a plain `pip install -e .` installs them too.
dependencies = [
  "pymupdf>=1.26,<2",
  "httpx>=0.27,<1",
  "anthropic>=2.14,<3",
  "pydantic>=2.7,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]
# Kept so older instructions (pip install -e ".[ai]") still work; the reviewer's packages are regular dependencies now.
ai = []

[project.scripts]
k12-pipeline = "k12_pipeline.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/k12_pipeline"]

[tool.ruff]
line-length = 110
target-version = "py311"
