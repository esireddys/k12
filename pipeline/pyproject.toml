[project]
name = "k12-pipeline"
version = "0.1.0"
description = "Imports STAAR released tests, generates variants, and runs the AI reviewer."
requires-python = ">=3.12"
dependencies = [
  "pymupdf>=1.24",
  "httpx>=0.27",
  "pydantic>=2.7",
  "anthropic>=0.40",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
k12-pipeline = "k12_pipeline.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/k12_pipeline"]

[tool.ruff]
line-length = 110
